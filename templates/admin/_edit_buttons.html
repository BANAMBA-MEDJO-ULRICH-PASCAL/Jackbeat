<div class="d-flex gap-2 mt-4 flex-wrap">
  <button type="submit" name="submit_action" value="save" class="btn btn-jb-outline">
    <i class="bi bi-check-lg me-1"></i>{{ _('Enregistrer') }}
  </button>
  {% if obj.statut != 'approuve' %}
    <button type="submit" name="submit_action" value="save_approve" class="btn btn-jb-gold">
      <i class="bi bi-check2-all me-1"></i>{{ _('Enregistrer et publier') }}
    </button>
  {% endif %}
  <a href="{{ cancel_url }}" class="btn btn-jb-outline">{{ _('Annuler') }}</a>
</div>
