{% extends "base.html" %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container text-center" style="max-width:620px;padding:4rem 0;">
    <div style="font-family:var(--font-display);font-size:5rem;font-weight:900;color:var(--green);line-height:1;">{{ code }}</div>
    <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:900;margin:1rem 0;">{{ titre }}</h1>
    <p style="color:var(--text-mid);margin-bottom:2rem;">{{ texte }}</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{{ url_for('main_bp.index') }}" class="btn btn-jb-gold"><i class="bi bi-house me-2"></i>{{ _("Retour à l'accueil") }}</a>
      <a href="{{ url_for('public_bp.artistes') }}" class="btn btn-jb-outline">{{ _('Explorer les artistes') }}</a>
    </div>
  </div>
</section>
{% endblock %}
